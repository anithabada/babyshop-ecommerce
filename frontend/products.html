<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop All Products - BabyShop</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-root"></div>

<div class="container">
  <h2 class="section-title">Shop All Products</h2>

  <div class="card" style="display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:20px;">
    <input type="text" id="search-input" placeholder="Search by name, brand or category..." style="flex:1; min-width:220px; padding:10px 14px; border-radius:10px; border:1.5px solid var(--border);">
    <button class="btn btn-primary" id="search-btn">Search</button>
  </div>

  <div class="category-grid" id="category-filter"></div>

  <div class="product-grid" id="product-grid">
    <div class="loading">Loading products...</div>
  </div>
</div>

<div id="footer-root"></div>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/products.js"></script>
</body>
</html>
